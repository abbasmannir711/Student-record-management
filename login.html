<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <link rel="stylesheet" href="register.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.card h1{
    text-align:center;
    margin-bottom:25px;
    color:#1e3a8a;
}

.card input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.card input:focus{
    border-color:#2563eb;
}

.card button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
    transition:.3s;
}

.card button:hover{
    background:#1d4ed8;
}

.card p{
    margin-top:18px;
    text-align:center;
}

.card a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.card a:hover{
    text-decoration:underline;
}
        .logo{
    width:90px;
    height:90px;
    display:block;
    margin:0 auto 15px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #2563eb;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
        }

@media(max-width:500px){
    .card{
        padding:25px;
    }
}
    </style>
</head>
<body>

<div class="container">

    <div class="card">
      <img src="Fudmalogo.png
         alt="FUDMA Logo"
         class="logo">

        <h1>Student Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
