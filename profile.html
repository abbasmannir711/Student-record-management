<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="profile.css">
</head>
<body>

<header class="navbar">
    <h2>🎓 Student Record Management</h2>

    <a href="dashboard.html" class="back-btn">
        ← Dashboard
    </a>
</header>

<div class="container">

    <div class="profile-card">

        <h1>My Profile</h1>

        <form id="profileForm">

            <div class="profile-item">
                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    disabled
                >
            </div>

            <div class="profile-item">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    disabled
                >
            </div>

            <div class="profile-item">
                <label>Matric Number</label>

                <input
                    type="text"
                    id="rollNo"
                    disabled
                >
            </div>

            <div class="profile-item">
                <label>Department</label>

                <input
                    type="text"
                    id="department"
                    disabled
                >
            </div>

            <div class="profile-item">
                <label>Faculty</label>

                <input
                    type="text"
                    id="faculty"
                    disabled
                >
            </div>

            <button
                type="button"
                id="editBtn">
                Edit Profile
            </button>

            <button
                type="submit"
                id="saveBtn"
                style="display:none;">
                Save Changes
            </button>

        </form>

    </div>

</div>

<script src="profile.js"></script>

</body>
</html>
